<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현대백화점 문화센터 링크 생성기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 p-4 sm:p-8">

    <div class="container mx-auto space-y-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800">현대백화점 문화센터 링크 생성기</h1>
            <p class="mt-2 text-lg text-gray-600">필요한 링크를 간편하게 생성하세요.</p>
        </header>

        <!-- 섹션 1: 강의 바로 신청 링크 생성기 -->
        <section id="section-1" class="card p-6">
            <h2 class="text-2xl font-bold text-gray-700 border-b-2 border-gray-200 pb-2 mb-4">강의 바로 신청 링크 (linkBridge.do)</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="store_code_direct" class="block text-sm font-medium text-gray-700">점포 코드</label>
                        <select id="store_code_direct" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" onchange="updateTermCodesByStore()">
                            <!-- 옵션은 JavaScript로 채워집니다 -->
                        </select>
                    </div>
                    <div>
                        <label for="term_code_direct" class="block text-sm font-medium text-gray-700">기수 코드</label>
                        <div class="relative mt-1">
                            <select id="term_code_direct" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
                                <!-- 옵션은 JavaScript로 채워집니다 -->
                            </select>
                            <input type="text" id="term_code_manual_direct" placeholder="기수 코드 직접 입력 (예: 024)" class="hidden mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
                            <button onclick="toggleTermInput('direct')" class="absolute inset-y-0 right-0 px-3 flex items-center text-sm font-medium text-gray-600 hover:text-gray-900">직접 입력/선택</button>
                        </div>
                    </div>
                </div>
                <div>
                    <label for="course_number_direct" class="block text-sm font-medium text-gray-700">전단 번호 (crsSqNo)</label>
                    <input type="text" id="course_number_direct" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" placeholder="예: 0001">
                </div>
                
                <div class="flex flex-col sm:flex-row justify-center space-y-2 sm:space-y-0 sm:space-x-4">
                    <button onclick="generateDirectLink()" class="px-6 py-2 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-600 transition-colors">링크 생성</button>
                    <button onclick="resetSection('section-1')" class="px-6 py-2 bg-gray-300 text-gray-800 font-semibold rounded-lg shadow-md hover:bg-gray-400 transition-colors">초기화</button>
                </div>

                <div class="mt-4 border-t pt-4 border-gray-200">
                    <h3 class="text-lg font-bold text-gray-700 mb-2">생성된 링크</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-sm font-medium text-gray-500">PC (웹사이트)</span>
                                <button onclick="copyLink('pc')" class="text-blue-500 text-sm hover:underline">복사</button>
                            </div>
                            <p class="text-sm link-output" id="generated_link_pc"></p>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-sm font-medium text-gray-500">모바일 (웹사이트)</span>
                                <button onclick="copyLink('mobile')" class="text-blue-500 text-sm hover:underline">복사</button>
                            </div>
                            <p class="text-sm link-output" id="generated_link_mobile"></p>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-sm font-medium text-gray-500">웹 링크 (앱 연동)</span>
                                <button onclick="copyLink('web')" class="text-blue-500 text-sm hover:underline">복사</button>
                            </div>
                            <p class="text-sm link-output" id="generated_link_web"></p>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-sm font-medium text-gray-500">모바일 앱 바로가기</span>
                                <button onclick="copyLink('mobile_app')" class="text-blue-500 text-sm hover:underline">복사</button>
                            </div>
                            <p class="text-sm link-output" id="generated_link_mobile_app"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 섹션 2 (순서 변경): 검색 링크 생성기 -->
        <section id="section-2" class="card p-6">
            <h2 class="text-2xl font-bold text-gray-700 border-b-2 border-gray-200 pb-2 mb-4">검색 링크 생성기 (search.do)</h2>
            <div class="space-y-4">
                <div>
                    <label for="store_code_search" class="block text-sm font-medium text-gray-700">점포 코드</label>
                    <select id="store_code_search" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" onchange="updateTermCodesByStore()">
                        <!-- 옵션은 JavaScript로 채워집니다 -->
                    </select>
                </div>
                <div>
                    <label for="term_code_search" class="block text-sm font-medium text-gray-700">기수 코드</label>
                    <div class="relative mt-1">
                        <select id="term_code_search" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
                            <!-- 옵션은 JavaScript로 채워집니다 -->
                        </select>
                        <input type="text" id="term_code_manual_search" placeholder="기수 코드 직접 입력 (예: 024)" class="hidden mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
                        <button onclick="toggleTermInput('search')" class="absolute inset-y-0 right-0 px-3 flex items-center text-sm font-medium text-gray-600 hover:text-gray-900">직접 입력/선택</button>
                    </div>
                </div>
                <div>
                    <label for="search_text" class="block text-sm font-medium text-gray-700">검색어</label>
                    <input type="text" id="search_text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" placeholder="예: 요리, 발레, 영어">
                </div>

                <div class="flex flex-col sm:flex-row justify-center space-y-2 sm:space-y-0 sm:space-x-4">
                    <button onclick="generateSearchLink()" class="px-6 py-2 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-600 transition-colors">링크 생성</button>
                    <button onclick="resetSection('section-2')" class="px-6 py-2 bg-gray-300 text-gray-800 font-semibold rounded-lg shadow-md hover:bg-gray-400 transition-colors">초기화</button>
                </div>

                <div class="mt-4 border-t pt-4 border-gray-200">
                    <h3 class="text-lg font-bold text-gray-700 mb-2">생성된 링크</h3>
                    <div class="bg-gray-50 p-3 rounded-lg">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-sm font-medium text-gray-500">PC & 모바일</span>
                            <button onclick="copyLink('search')" class="text-blue-500 text-sm hover:underline">복사</button>
                        </div>
                        <p class="text-sm link-output" id="generated_link_search"></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 섹션 3 (순서 변경): 앱카드 링크 생성기 -->
        <section id="section-3" class="card p-6">
            <h2 class="text-2xl font-bold text-gray-700 border-b-2 border-gray-200 pb-2 mb-4">앱카드 링크 생성기 (Prism.do)</h2>
            <div class="space-y-4">
                <div>
                    <label for="store_code_prism" class="block text-sm font-medium text-gray-700">점포 코드</label>
                    <select id="store_code_prism" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" onchange="updateTermCodesByStore()">
                        <!-- 옵션은 JavaScript로 채워집니다 -->
                    </select>
                </div>
                <div>
                    <label for="term_code_prism" class="block text-sm font-medium text-gray-700">기수 코드</label>
                    <div class="relative mt-1">
                        <select id="term_code_prism" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
                            <!-- 옵션은 JavaScript로 채워집니다 -->
                        </select>
                        <input type="text" id="term_code_manual_prism" placeholder="기수 코드 직접 입력 (예: 024)" class="hidden mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
                        <button onclick="toggleTermInput('prism')" class="absolute inset-y-0 right-0 px-3 flex items-center text-sm font-medium text-gray-600 hover:text-gray-900">직접 입력/선택</button>
                    </div>
                </div>
                <div>
                    <label for="course_number_prism" class="block text-sm font-medium text-gray-700">전단 번호 (crsSqNo)</label>
                    <input type="text" id="course_number_prism" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" placeholder="예: 0001">
                </div>

                <div class="flex flex-col sm:flex-row justify-center space-y-2 sm:space-y-0 sm:space-x-4">
                    <button onclick="generatePrismAppcardLink()" class="px-6 py-2 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-600 transition-colors">링크 생성</button>
                    <button onclick="resetSection('section-3')" class="px-6 py-2 bg-gray-300 text-gray-800 font-semibold rounded-lg shadow-md hover:bg-gray-400 transition-colors">초기화</button>
                </div>

                <div class="mt-4 border-t pt-4 border-gray-200">
                    <h3 class="text-lg font-bold text-gray-700 mb-2">생성된 링크</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-gray-50 p-3 rounded-lg">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-sm font-medium text-gray-500">PC & 모바일</span>
                                <button onclick="copyLink('prism')" class="text-blue-500 text-sm hover:underline">복사</button>
                            </div>
                            <p class="text-sm link-output" id="generated_link_prism"></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
