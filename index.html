<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현대백화점 문화센터 링크 생성기</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .small-button {
            font-size: 0.7em; /* 기존 0.8em에서 0.7em으로 축소 */
            padding: 3px 6px; /* 패딩도 80% 수준으로 조정 */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>현대백화점 문화센터 링크 생성기 🔗</h1>
        
        <div class="section-box" id="section-1">
            <h2>1. 강의 바로 신청 링크 생성기 <button class="reset-button small-button" onclick="resetSection('section-1')">초기화</button></h2>
            <p class="section-description">강좌 개설 후 점코드, 기수, 전단번호를 넣어 바로 신청 가능한 링크를 생성합니다.</p>

            <div class="input-group">
                <label for="store_code_direct">점포 코드 (stCd):</label>
                <select id="store_code_direct" onchange="updateTermCodesByStore()">
                    </select>
            </div>

            <div class="input-group">
                <label for="term_code_direct">기수 코드 (sqCd):</label>
                <select id="term_code_direct">
                    </select>
                <input type="text" id="term_code_manual_direct" placeholder="직접 입력 (예: 024, 028)" style="margin-top: 10px; display: none;">
                <button onclick="toggleTermInput('direct')" class="small-button">직접 입력/선택</button>
            </div>

            <div class="input-group">
                <label for="course_number_direct">전단 번호 (crsSqNo):</label>
                <input type="text" id="course_number_direct" placeholder="예: 7197">
            </div>

            <button onclick="generateDirectLink()">링크 생성하기</button>

            <div class="result-box">
                <p>생성된 웹 링크:</p>
                <a id="generated_link_web" href="#" target="_blank"></a>
                <button class="small-button" onclick="copyLink('web')" id="copy_button_web">링크 복사</button>
            </div>
            
            <div class="result-box mt-3">
                <p>생성된 앱 링크 (앱카드 > 클래스 페이지 이용):</p>
                <a id="generated_link_app" href="#" target="_blank"></a>
                <button class="small-button" onclick="copyLink('app')" id="copy_button_app">링크 복사</button>
            </div>
        </div>

        <hr> <div class="section-box" id="section-2">
            <h2>2. 앱카드 페이지 링크 생성기 (프리즘) <button class="reset-button small-button" onclick="resetSection('section-2')">초기화</button></h2>
            <p class="section-description">'앱카드'에서 '앱카드' 연결에 사용하는 링크를 생성합니다.</p>
            <div class="input-group">
                <label for="appcard_number_prism">앱카드 번호 (evntCrdCd):</label>
                <input type="text" id="appcard_number_prism" placeholder="예: E1102505404201">
            </div>

            <button onclick="generatePrismAppcardLink()">링크 생성하기</button>

            <div class="result-box">
                <p>생성된 링크:</p>
                <a id="generated_link_prism" href="#" target="_blank"></a>
                <button class="small-button" onclick="copyLink('prism')" id="copy_button_prism">링크 복사</button>
            </div>
        </div>

        <hr> <div class="section-box" id="section-3">
            <h2>3. 검색 결과 페이지 링크 생성기 <button class="reset-button small-button" onclick="resetSection('section-3')">초기화</button></h2>
            <p class="section-description">특정 검색 조건(점포, 카테고리, 검색어 등)이 적용된 강좌 목록 페이지 링크를 생성합니다.</p>

            <div class="input-group">
                <label for="device_type">장치 유형:</label>
                <select id="device_type" onchange="updateBaseUrlSearch()">
                    <option value="pc">PC</option>
                    <option value="mobile">모바일 웹</option>
                </select>
            </div>

            <div class="input-group">
                <label for="base_url_search">기본 URL:</label>
                <input type="text" id="base_url_search" value="https://www.ehyundai.com/newCulture/CT/CT010100_L.do"
